<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <title>Washer dryer drying a load of towels</title>
  <desc>Flat illustration: a washer dryer with a drying symbol on its display and warm air rising from the drum, beside a stack of folded towels and a plant.</desc>
  <defs>
    <!-- Soft blur for the shadows under objects -->
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft-sm" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <!-- background -->
  <rect width="960" height="640" fill="#FFF7ED"/>
  <path d="M813.39 409.4 C787.49 464.16 693.62 517.78 617.32 543.58 C541.03 569.38 429.14 584.45 355.61 564.2 C282.08 543.95 213.39 478.65 176.12 422.08 C138.85 365.52 106.07 280.54 132 224.81 C157.93 169.07 254.1 113.58 331.7 87.67 C409.3 61.76 524.1 48.11 597.6 69.34 C671.09 90.56 736.72 158.35 772.69 215.02 C808.65 271.7 839.28 354.64 813.39 409.4 Z" fill="#FFEDD5"/>
  <path d="M782 92h0M804 92h0M826 92h0M848 92h0M782 114h0M804 114h0M826 114h0M848 114h0M782 136h0M804 136h0M826 136h0M848 136h0M782 158h0M804 158h0M826 158h0M848 158h0" stroke="#FDBA74" stroke-width="7" stroke-linecap="round"/>
  <!-- floor -->
  <ellipse cx="480" cy="560" rx="410" ry="34" fill="#FED7AA" opacity="0.45"/>

  <!-- floor shadows -->
  <ellipse cx="470" cy="552" rx="176" ry="15" fill="#1F2937" opacity="0.16" filter="url(#soft)"/>
  <ellipse cx="748" cy="558" rx="104" ry="11" fill="#1F2937" opacity="0.14" filter="url(#soft)"/>
  <ellipse cx="186" cy="556" rx="58" ry="9" fill="#1F2937" opacity="0.14" filter="url(#soft)"/>

  <!-- snake plant in a white pot -->
  <g transform="translate(180 556) scale(0.82)">
    <g id="plant">
      <path d="M-31 -96 C-63.400000000000006 -143 -68.5 -210 -62 -250 C-55.5 -210 -16.599999999999998 -143 -5 -96 Z" fill="#16A34A"/>
      <path d="M-18 -106 C-40 -153 -62 -200 -62 -228" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <path d="M3 -96 C13.599999999999998 -133 51.5 -190 58 -230 C64.5 -190 60.400000000000006 -133 29 -96 Z" fill="#16A34A"/>
      <path d="M16 -106 C37 -143 58 -180 58 -208" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <path d="M-21 -96 C-42 -168 -31.5 -260 -24 -300 C-16.5 -260 12 -168 9 -96 Z" fill="#22C55E"/>
      <path d="M-6 -106 C-15 -178 -24 -250 -24 -278" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <path d="M-6 -96 C-8.2 -158 19 -240 26 -280 C33 -240 42.2 -158 22 -96 Z" fill="#22C55E"/>
      <path d="M8 -106 C17 -168 26 -230 26 -258" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <path d="M-17 -96 C-27 -183 -5.5 -290 2 -330 C9.5 -290 27 -183 13 -96 Z" fill="#86EFAC"/>
      <path d="M-2 -106 C0 -193 2 -280 2 -308" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <!-- pot -->
      <path d="M-50 -104 L50 -104 L40 0 L-40 0 Z" fill="#FFFFFF"/>
      <path d="M20 -104 L50 -104 L40 0 L14 0 Z" fill="#9CA3AF" opacity="0.35"/>
      <rect x="-56" y="-112" width="112" height="20" rx="6" fill="#FFFFFF"/>
      <rect x="-56" y="-112" width="112" height="6" rx="3" fill="#FFFFFF" opacity="0.15"/>
    </g>
  </g>

  <!-- washer dryer drying a load (drying symbol on the display, warm air rising from the drum) -->
  <g transform="translate(314 118)">
    <g id="washerdryer">
      <defs>
        <linearGradient id="washerdryer-body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#F3F4F6"/>
        </linearGradient>
        <linearGradient id="washerdryer-chrome" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
          <stop offset="0" stop-color="#F9FAFB"/>
          <stop offset="0.55" stop-color="#D1D5DB"/>
          <stop offset="1" stop-color="#9CA3AF"/>
        </linearGradient>
        <radialGradient id="washerdryer-glass" cx="0.42" cy="0.38" r="0.7">
          <stop offset="0" stop-color="#DBEAFE"/>
          <stop offset="1" stop-color="#93C5FD"/>
        </radialGradient>
        <radialGradient id="washerdryer-drum" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#6B7280"/>
          <stop offset="0.45" stop-color="#9CA3AF"/>
          <stop offset="1" stop-color="#D1D5DB"/>
        </radialGradient>
        <radialGradient id="washerdryer-seal" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.7" stop-color="#6B7280"/>
          <stop offset="0.86" stop-color="#9CA3AF"/>
          <stop offset="1" stop-color="#6B7280"/>
        </radialGradient>
        <clipPath id="washerdryer-window">
          <circle cx="150" cy="234" r="66"/>
        </clipPath>
      </defs>
      <!-- feet -->
      <rect x="22" y="416" width="34" height="18" rx="5" fill="#374151"/>
      <rect x="244" y="416" width="34" height="18" rx="5" fill="#374151"/>
      <!-- top of the cabinet, seen from slightly above -->
      <path d="M2 8 L298 8 L289 -27 Q288 -32 282 -32 L18 -32 Q12 -32 11 -27 Z" fill="#E5E7EB"/>
      <path d="M8 -6 L292 -6" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
      <!-- front panel -->
      <rect x="0" y="0" width="300" height="425" rx="12" fill="url(#washerdryer-body)"/>
      <!-- control panel strip -->
      <path d="M12 0 H288 A12 12 0 0 1 300 12 V78 H0 V12 A12 12 0 0 1 12 0 Z" fill="#F3F4F6"/>
      <rect x="0" y="78" width="300" height="3" fill="#E5E7EB"/>
      <!-- detergent drawer -->
      <rect x="16" y="17" width="94" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="28" y="48" width="70" height="6" rx="3" fill="#D1D5DB"/>
      <!-- power button -->
      <circle cx="128" cy="39" r="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="128" cy="39" r="3" fill="#F97316"/>
      <!-- display -->
      <rect x="146" y="25" width="66" height="28" rx="6" fill="#1F2937"/>
      <rect x="156" y="32" width="14" height="14" rx="2.5" fill="none" stroke="#FDBA74" stroke-width="2"/>
      <circle cx="163" cy="39" r="4" fill="none" stroke="#FDBA74" stroke-width="2"/>
      <rect x="176" y="37" width="9" height="5" rx="2.5" fill="#F97316"/>
      <rect x="188" y="37" width="9" height="5" rx="2.5" fill="#F97316"/>
      <rect x="200" y="37" width="6" height="5" rx="2.5" fill="#6B7280"/>
      <!-- programme dial -->
      <circle cx="229.02" cy="58.28" r="2" fill="#9CA3AF"/>
      <circle cx="222.26" cy="42.92" r="2" fill="#9CA3AF"/>
      <circle cx="224.81" cy="26.32" r="2" fill="#9CA3AF"/>
      <circle cx="235.88" cy="13.7" r="2" fill="#9CA3AF"/>
      <circle cx="252" cy="9" r="2" fill="#9CA3AF"/>
      <circle cx="268.12" cy="13.7" r="2" fill="#9CA3AF"/>
      <circle cx="279.19" cy="26.32" r="2" fill="#9CA3AF"/>
      <circle cx="281.74" cy="42.92" r="2" fill="#9CA3AF"/>
      <circle cx="274.98" cy="58.28" r="2" fill="#9CA3AF"/>
      <circle cx="252" cy="39" r="23" fill="#E5E7EB"/>
      <circle cx="252" cy="39" r="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="250" y="24" width="4" height="13" rx="2" fill="#F97316" transform="rotate(-40 252 39)"/>
      <!-- kick plate with the pump filter flap -->
      <rect x="0" y="384" width="300" height="3" fill="#E5E7EB"/>
      <rect x="18" y="396" width="60" height="22" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="38" y="401" width="20" height="4" rx="2" fill="#D1D5DB"/>
      <!-- shaded right-hand edge -->
      <path d="M284 0 H288 A12 12 0 0 1 300 12 V413 A12 12 0 0 1 288 425 H284 Z" fill="#1F2937" opacity="0.06"/>
      <!-- door (closed) -->
      <circle cx="154" cy="239" r="95" fill="#1F2937" opacity="0.08"/>
      <circle cx="150" cy="234" r="93" fill="url(#washerdryer-chrome)" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="150" cy="234" r="79" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
      <circle cx="150" cy="234" r="77" fill="#374151"/>
      <circle cx="150" cy="234" r="66" fill="url(#washerdryer-glass)"/>
      <g clip-path="url(#washerdryer-window)">
        <!-- towels tumbling as they dry -->
        <g transform="translate(150 296)">
          <rect x="-64" y="-18" width="128" height="36" rx="12" fill="#93C5FD"/>
          <rect x="-64" y="0" width="128" height="18" rx="9" fill="#60A5FA"/>
        </g>
        <g transform="translate(116 266) rotate(-18)">
          <rect x="-44" y="-18" width="88" height="36" rx="12" fill="#FDBA74"/>
          <rect x="-44" y="2" width="88" height="16" rx="8" fill="#F97316"/>
          <rect x="-30" y="-18" width="6" height="36" fill="#FFFFFF" opacity="0.6"/>
        </g>
        <g transform="translate(186 272) rotate(22)">
          <rect x="-42" y="-17" width="84" height="34" rx="12" fill="#FFFFFF"/>
          <rect x="-42" y="2" width="84" height="15" rx="7" fill="#E5E7EB"/>
          <rect x="22" y="-17" width="6" height="34" fill="#93C5FD"/>
        </g>
      </g>
      <circle cx="150" cy="234" r="66" fill="none" stroke="#1F2937" stroke-width="3" opacity="0.12"/>
      <!-- reflection on the glass -->
      <path d="M97.69 217 A55 55 0 0 1 127.63 183.75" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <path d="M136.69 180.63 A55 55 0 0 1 146.16 179.13" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <!-- door handle (grip moulded into the right of the door ring) -->
      <path d="M232.24 208.86 A86 86 0 0 1 232.24 259.14" fill="none" stroke="#6B7280" stroke-width="9" stroke-linecap="round"/>
      <path d="M233.07 211.74 A86 86 0 0 1 233.07 256.26" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
      <!-- warm air rising from the drum -->
      <linearGradient id="washerdryer-heat" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="100">
        <stop offset="0" stop-color="#F97316" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
      </linearGradient>
      <path d="M118 246 C128.4 240.5 128.4 229.5 118 224 C107.6 218.5 107.6 207.5 118 202 C128.4 196.5 128.4 185.5 118 180 C107.6 174.5 107.6 163.5 118 158 C128.4 152.5 128.4 141.5 118 136 C107.6 130.5 107.6 119.5 118 114" fill="none" stroke="url(#washerdryer-heat)" stroke-width="7" stroke-linecap="round"/>
      <path d="M150 238 C160.4 232.5 160.4 221.5 150 216 C139.6 210.5 139.6 199.5 150 194 C160.4 188.5 160.4 177.5 150 172 C139.6 166.5 139.6 155.5 150 150 C160.4 144.5 160.4 133.5 150 128 C139.6 122.5 139.6 111.5 150 106" fill="none" stroke="url(#washerdryer-heat)" stroke-width="7" stroke-linecap="round"/>
      <path d="M182 246 C192.4 240.5 192.4 229.5 182 224 C171.6 218.5 171.6 207.5 182 202 C192.4 196.5 192.4 185.5 182 180 C171.6 174.5 171.6 163.5 182 158 C192.4 152.5 192.4 141.5 182 136 C171.6 130.5 171.6 119.5 182 114" fill="none" stroke="url(#washerdryer-heat)" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- stack of folded towels -->
  <g transform="translate(744 558) scale(0.98)">
    <g id="towels">
      <g transform="translate(0 -40)">
        <rect x="-95" y="0" width="190" height="40" rx="15.384615384615383" fill="#93C5FD"/>
        <rect x="-95" y="20.8" width="190" height="19.2" rx="10" fill="#60A5FA"/>
        <rect x="-77" y="0" width="7" height="40" fill="#FFFFFF" opacity="0.75"/>
        <rect x="-65" y="0" width="4" height="40" fill="#FFFFFF" opacity="0.75"/>
        <path d="M81 6 Q91 20 81 34" fill="none" stroke="#1F2937" stroke-width="3" opacity="0.08"/>
      </g>
      <g transform="translate(-6 -78)">
        <rect x="-90" y="0" width="180" height="38" rx="14.615384615384615" fill="#FFFFFF"/>
        <rect x="-90" y="19.76" width="180" height="18.24" rx="9.5" fill="#E5E7EB"/>
        <rect x="-72" y="0" width="7" height="38" fill="#F97316" opacity="0.75"/>
        <rect x="-60" y="0" width="4" height="38" fill="#F97316" opacity="0.75"/>
        <path d="M76 6 Q86 19 76 32" fill="none" stroke="#1F2937" stroke-width="3" opacity="0.08"/>
      </g>
      <g transform="translate(5 -118)">
        <rect x="-93" y="0" width="186" height="40" rx="15.384615384615383" fill="#FDBA74"/>
        <rect x="-93" y="20.8" width="186" height="19.2" rx="10" fill="#F97316"/>
        <rect x="-75" y="0" width="7" height="40" fill="#FFFFFF" opacity="0.75"/>
        <rect x="-63" y="0" width="4" height="40" fill="#FFFFFF" opacity="0.75"/>
        <path d="M79 6 Q89 20 79 34" fill="none" stroke="#1F2937" stroke-width="3" opacity="0.08"/>
      </g>
      <g transform="translate(-3 -154)">
        <rect x="-88" y="0" width="176" height="36" rx="13.846153846153845" fill="#F3F4F6"/>
        <rect x="-88" y="18.72" width="176" height="17.28" rx="9" fill="#D1D5DB"/>
        <rect x="-70" y="0" width="7" height="36" fill="#60A5FA" opacity="0.75"/>
        <rect x="-58" y="0" width="4" height="36" fill="#60A5FA" opacity="0.75"/>
        <path d="M74 6 Q84 18 74 30" fill="none" stroke="#1F2937" stroke-width="3" opacity="0.08"/>
      </g>
    </g>
  </g>

  <path d="M700 198 Q702.88 211.12 716 214 Q702.88 216.88 700 230 Q697.12 216.88 684 214 Q697.12 211.12 700 198 Z" fill="#F97316"/>
  <path d="M736 259 Q737.62 266.38 745 268 Q737.62 269.62 736 277 Q734.38 269.62 727 268 Q734.38 266.38 736 259 Z" fill="#FDBA74"/>
</svg>
