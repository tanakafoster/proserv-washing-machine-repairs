<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <title>Top loader washing machine with its lid open</title>
  <desc>Flat illustration: a top loader washing machine with its glass lid open showing the drum and agitator, with a laundry basket, a detergent bottle and a spanner.</desc>
  <defs>
    <!-- Soft blur for the shadows under objects -->
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft-sm" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <!-- background -->
  <rect width="960" height="640" fill="#FFF7ED"/>
  <path d="M674.73 526.18 C606.27 562.81 495.25 594.66 417.4 583.76 C339.55 572.86 255.79 512.79 207.63 460.76 C159.47 408.74 115.15 329.73 128.42 271.59 C141.7 213.46 218.15 148.96 287.28 111.97 C356.41 74.98 466.17 38.86 543.21 49.66 C620.25 60.46 702.01 124.36 749.5 176.74 C796.99 229.12 840.59 305.71 828.13 363.95 C815.67 422.19 743.18 489.54 674.73 526.18 Z" fill="#FFEDD5"/>
  <path d="M780 84h0M802 84h0M824 84h0M846 84h0M780 106h0M802 106h0M824 106h0M846 106h0M780 128h0M802 128h0M824 128h0M846 128h0M780 150h0M802 150h0M824 150h0M846 150h0" stroke="#FDBA74" stroke-width="7" stroke-linecap="round"/>
  <!-- floor -->
  <ellipse cx="480" cy="580" rx="410" ry="32" fill="#FED7AA" opacity="0.45"/>

  <!-- floor shadows -->
  <ellipse cx="484.32" cy="572.48" rx="130" ry="12" fill="#1F2937" opacity="0.16" filter="url(#soft)"/>
  <ellipse cx="236" cy="584" rx="110" ry="11" fill="#1F2937" opacity="0.14" filter="url(#soft)"/>
  <ellipse cx="726" cy="582" rx="56" ry="8" fill="#1F2937" opacity="0.14" filter="url(#soft)"/>
  <ellipse cx="626" cy="596" rx="74" ry="7" fill="#1F2937" opacity="0.1" filter="url(#soft)"/>

  <!-- laundry basket -->
  <g transform="translate(232 584) scale(0.86)">
    <g id="basket">
      <!-- clean laundry, folded and stacked in the basket -->
      <!-- folded blue shirt -->
      <rect x="-96" y="-170" width="192" height="40" rx="13" fill="#93C5FD"/>
      <rect x="-96" y="-150" width="192" height="20" rx="10" fill="#60A5FA"/>
      <path d="M-22 -170 Q0 -150 22 -170 Z" fill="#BFDBFE"/>
      <path d="M-22 -170 Q0 -150 22 -170" fill="none" stroke="#60A5FA" stroke-width="3"/>
      <!-- folded white towel -->
      <g transform="rotate(-2 0 -186)">
        <rect x="-84" y="-200" width="168" height="34" rx="11" fill="#FFFFFF"/>
        <rect x="-84" y="-182" width="168" height="16" rx="8" fill="#E5E7EB"/>
        <rect x="-68" y="-200" width="7" height="34" fill="#93C5FD"/>
        <rect x="61" y="-200" width="7" height="34" fill="#93C5FD"/>
      </g>
      <!-- folded orange towel on top -->
      <g transform="rotate(3 0 -214)">
        <rect x="-68" y="-228" width="136" height="32" rx="10" fill="#FDBA74"/>
        <rect x="-68" y="-211" width="136" height="15" rx="7.5" fill="#F97316"/>
        <rect x="-54" y="-228" width="6" height="32" fill="#FFFFFF" opacity="0.6"/>
        <rect x="48" y="-228" width="6" height="32" fill="#FFFFFF" opacity="0.6"/>
      </g>
      <!-- basket -->
      <path d="M-112 -132 L112 -132 L98 -8 Q97 0 89 0 L-89 0 Q-97 0 -98 -8 Z" fill="#FFFFFF"/>
      <rect x="-83" y="-112" width="20.67" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="-54.33" y="-112" width="20.67" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="-25.67" y="-112" width="20.67" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="3" y="-112" width="20.67" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="31.67" y="-112" width="20.67" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="60.33" y="-112" width="20.67" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="-79" y="-80" width="19.33" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="-51.67" y="-80" width="19.33" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="-24.33" y="-80" width="19.33" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="3" y="-80" width="19.33" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="30.33" y="-80" width="19.33" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="57.67" y="-80" width="19.33" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="-75" y="-48" width="18" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="-49" y="-48" width="18" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="-23" y="-48" width="18" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="3" y="-48" width="18" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="29" y="-48" width="18" height="18" rx="6" fill="#E5E7EB"/>
      <rect x="55" y="-48" width="18" height="18" rx="6" fill="#E5E7EB"/>
      <path d="M60 -132 L112 -132 L98 -8 Q97 0 89 0 L50 0 Z" fill="#1F2937" opacity="0.06"/>
      <rect x="-120" y="-142" width="240" height="20" rx="8" fill="#F3F4F6"/>
      <rect x="-108" y="-137" width="30" height="8" rx="4" fill="#D1D5DB"/>
      <rect x="78" y="-137" width="30" height="8" rx="4" fill="#D1D5DB"/>
    </g>
  </g>

  <!-- top loader washing machine with the lid open (drum and agitator visible) -->
  <g transform="translate(372 260) scale(0.72)">
    <g id="toploader">
      <defs>
        <linearGradient id="toploader-body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#F3F4F6"/>
        </linearGradient>
        <linearGradient id="toploader-tub" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#D1D5DB"/>
          <stop offset="0.55" stop-color="#6B7280"/>
          <stop offset="1" stop-color="#374151"/>
        </linearGradient>
        <linearGradient id="toploader-lidglass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#BFDBFE"/>
          <stop offset="1" stop-color="#9CA3AF"/>
        </linearGradient>
        <linearGradient id="toploader-agitator" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#D1D5DB"/>
        </linearGradient>
        <clipPath id="toploader-opening">
          <ellipse cx="150" cy="-50" rx="100" ry="31"/>
        </clipPath>
      </defs>
      <!-- control panel at the back -->
      <path d="M24 -170 L276 -170 L272 -180 L28 -180 Z" fill="#E5E7EB"/>
      <path d="M20 -100 V-158 Q20 -170 32 -170 H268 Q280 -170 280 -158 V-100 Z" fill="#F3F4F6"/>
      <rect x="20" y="-104" width="260" height="4" fill="#E5E7EB"/>
      <circle cx="48" cy="-136" r="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="48" cy="-136" r="2.5" fill="#F97316"/>
      <rect x="88" y="-150" width="70" height="28" rx="6" fill="#1F2937"/>
      <path d="M102 -144 C106 -139 108 -136 108 -133 A6 6 0 0 1 96 -133 C96 -136 98 -139 102 -144 Z" fill="#93C5FD"/>
      <rect x="116" y="-138" width="9" height="5" rx="2.5" fill="#F97316"/>
      <rect x="128" y="-138" width="9" height="5" rx="2.5" fill="#F97316"/>
      <rect x="140" y="-138" width="6" height="5" rx="2.5" fill="#6B7280"/>
      <circle cx="178" cy="-136" r="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="200" cy="-136" r="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="256" cy="-136" r="21" fill="#E5E7EB"/>
      <circle cx="256" cy="-136" r="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="254" y="-149" width="4" height="12" rx="2" fill="#F97316" transform="rotate(35 256 -136)"/>
      <path d="M268 -170 H268 Q280 -170 280 -158 V-100 H268 Z" fill="#1F2937" opacity="0.06"/>
      <!-- feet -->
      <rect x="22" y="416" width="34" height="18" rx="5" fill="#374151"/>
      <rect x="244" y="416" width="34" height="18" rx="5" fill="#374151"/>
      <!-- top of the cabinet, seen from slightly above -->
      <path d="M2 8 L298 8 L281 -95 Q280 -100 274 -100 L26 -100 Q20 -100 19 -95 Z" fill="#E5E7EB"/>
      <!-- front panel -->
      <rect x="0" y="0" width="300" height="425" rx="12" fill="url(#toploader-body)"/>
      <rect x="0" y="384" width="300" height="3" fill="#E5E7EB"/>
      <rect x="110" y="10" width="80" height="8" rx="4" fill="#E5E7EB"/>
      <path d="M284 0 H288 A12 12 0 0 1 300 12 V413 A12 12 0 0 1 288 425 H284 Z" fill="#1F2937" opacity="0.06"/>
      <!-- the opening in the top, with the drum and the agitator -->
      <ellipse cx="150" cy="-50" rx="108" ry="34" fill="#D1D5DB"/>
      <ellipse cx="150" cy="-50" rx="100" ry="31" fill="url(#toploader-tub)"/>
      <g clip-path="url(#toploader-opening)">
        <path d="M66 -75h0M78 -70h0M90 -75h0M102 -70h0M114 -75h0M126 -70h0M138 -75h0M150 -70h0M162 -75h0M174 -70h0M186 -75h0M198 -70h0M210 -75h0M222 -70h0M234 -75h0" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
        <!-- laundry at the bottom of the drum -->
        <path d="M40 -16 C56 -46 92 -52 116 -40 C126 -34 128 -16 128 -16 Z" fill="#93C5FD"/>
        <path d="M60 -34 C76 -42 94 -42 108 -36" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
        <path d="M172 -16 C172 -38 196 -50 224 -46 C244 -42 258 -30 262 -16 Z" fill="#F97316"/>
        <path d="M196 -36 C210 -42 228 -40 240 -32" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
        <!-- agitator -->
        <rect x="132" y="-64" width="36" height="58" fill="url(#toploader-agitator)"/>
        <path d="M132 -50 L168 -59 M132 -39 L168 -48 M132 -28 L168 -37" stroke="#D1D5DB" stroke-width="3.5"/>
        <ellipse cx="150" cy="-64" rx="18" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      </g>
      <ellipse cx="150" cy="-50" rx="104" ry="32.5" fill="none" stroke="#E5E7EB" stroke-width="3"/>
      <!-- lid, opened upright against the control panel (white frame, tinted window) -->
      <path d="M64 -98 L72 -250 Q73 -262 85 -262 H215 Q227 -262 228 -250 L236 -98 Z" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
      <path d="M200 -262 H215 Q227 -262 228 -250 L236 -98 H218 Z" fill="#1F2937" opacity="0.05"/>
      <path d="M84 -118 L90 -236 Q90 -242 96 -242 H204 Q210 -242 210 -236 L216 -118 Z" fill="url(#toploader-lidglass)"/>
      <path d="M104 -130 L140 -228 M128 -126 L152 -192" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
      <rect x="124" y="-258" width="52" height="8" rx="4" fill="#D1D5DB"/>
      <rect x="60" y="-108" width="180" height="10" rx="5" fill="#D1D5DB"/>
    </g>
  </g>

  <!-- detergent bottle -->
  <g transform="translate(726 582) scale(0.9)">
    <g id="detergent">
      <!-- handle loop -->
      <path d="M12 -150 L44 -150 Q56 -150 56 -138 L56 -96 L40 -96 L40 -134 L12 -134 Z" fill="#60A5FA"/>
      <!-- body -->
      <path d="M-46 -132 Q-46 -150 -28 -150 L22 -150 Q46 -150 52 -128 L56 -110 L56 -10 Q56 0 46 0 L-36 0 Q-46 0 -46 -10 Z" fill="#60A5FA"/>
      <path d="M36 -128 Q46 -126 52 -110 L56 -110 L56 -10 Q56 0 46 0 L30 0 Z" fill="#3B82F6" opacity="0.6"/>
      <!-- cap -->
      <rect x="-36" y="-170" width="38" height="24" rx="6" fill="#F97316"/>
      <rect x="-36" y="-170" width="38" height="7" rx="3.5" fill="#FFFFFF" opacity="0.3"/>
      <!-- label with a water-drop symbol -->
      <rect x="-32" y="-104" width="70" height="72" rx="12" fill="#FFFFFF"/>
      <path d="M3 -92 C12 -81 17 -73 17 -65 A14 14 0 0 1 -11 -65 C-11 -73 -6 -81 3 -92 Z" fill="#60A5FA"/>
      <path d="M-4 -68 A7 7 0 0 0 2 -60" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <rect x="-36" y="-138" width="10" height="120" rx="5" fill="#FFFFFF" opacity="0.25"/>
    </g>
  </g>

  <!-- spanner on the floor -->
  <g transform="translate(622 592) rotate(10) scale(0.6)">
    <g id="spanner">
      <defs>
        <mask id="spanner-cut" maskUnits="userSpaceOnUse" x="-140" y="-50" width="280" height="100">
          <rect x="-140" y="-50" width="280" height="100" fill="#FFFFFF"/>
          <circle cx="-92" cy="0" r="11" fill="#000000"/>
          <g transform="rotate(-15 94 0)">
            <rect x="94" y="-10.5" width="50" height="21" fill="#000000"/>
            <circle cx="94" cy="0" r="10.5" fill="#000000"/>
          </g>
        </mask>
        <g id="spanner-shape" mask="url(#spanner-cut)">
          <circle cx="-92" cy="0" r="24"/>
          <path d="M-82 -10 C-40 -8 40 -8 82 -12 L82 12 C40 8 -40 8 -82 10 Z"/>
          <circle cx="94" cy="0" r="27"/>
        </g>
      </defs>
      <use href="#spanner-shape" fill="#6B7280" transform="translate(0 5)"/>
      <use href="#spanner-shape" fill="#9CA3AF"/>
      <path d="M-70 -3 C-30 -2 30 -2 70 -4" fill="none" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
      <path d="M-109.23 -3.04 A17.5 17.5 0 0 1 -86.01 -16.44" fill="none" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
      <path d="M75.21 -6.84 A20 20 0 0 1 104 -17.32" fill="none" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <path d="M320 135 Q322.7 147.3 335 150 Q322.7 152.7 320 165 Q317.3 152.7 305 150 Q317.3 147.3 320 135 Z" fill="#F97316"/>
  <path d="M290 192 Q291.44 198.56 298 200 Q291.44 201.44 290 208 Q288.56 201.44 282 200 Q288.56 198.56 290 192 Z" fill="#FDBA74"/>
</svg>
