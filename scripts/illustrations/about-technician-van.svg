<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <title>Front door of a home with a washing machine inside and a toolbox on the porch</title>
  <desc>Flat illustration: a house front with the door open, a washing machine visible in the hallway, a technician’s toolbox on the porch, a plant, windows and a wall light.</desc>
  <defs>
    <!-- Soft blur for the shadows under objects -->
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft-sm" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <!-- wall of the house (plaster) -->
  <rect width="960" height="640" fill="#FFEDD5"/>
  <rect x="0" y="534" width="960" height="26" fill="#FED7AA"/>
  <!-- roof edge along the top: tiles, gutter and the shade under the eave -->
  <rect x="0" y="54" width="960" height="18" fill="#1F2937" opacity="0.06"/>
  <rect x="0" y="0" width="960" height="24" fill="#6B7280"/>
  <path d="M0 22 a20 20 0 0 0 40 0 ZM40 22 a20 20 0 0 0 40 0 ZM80 22 a20 20 0 0 0 40 0 ZM120 22 a20 20 0 0 0 40 0 ZM160 22 a20 20 0 0 0 40 0 ZM200 22 a20 20 0 0 0 40 0 ZM240 22 a20 20 0 0 0 40 0 ZM280 22 a20 20 0 0 0 40 0 ZM320 22 a20 20 0 0 0 40 0 ZM360 22 a20 20 0 0 0 40 0 ZM400 22 a20 20 0 0 0 40 0 ZM440 22 a20 20 0 0 0 40 0 ZM480 22 a20 20 0 0 0 40 0 ZM520 22 a20 20 0 0 0 40 0 ZM560 22 a20 20 0 0 0 40 0 ZM600 22 a20 20 0 0 0 40 0 ZM640 22 a20 20 0 0 0 40 0 ZM680 22 a20 20 0 0 0 40 0 ZM720 22 a20 20 0 0 0 40 0 ZM760 22 a20 20 0 0 0 40 0 ZM800 22 a20 20 0 0 0 40 0 ZM840 22 a20 20 0 0 0 40 0 ZM880 22 a20 20 0 0 0 40 0 ZM920 22 a20 20 0 0 0 40 0 Z" fill="#6B7280"/>
  <path d="M8 28 a14 14 0 0 0 12 13M48 28 a14 14 0 0 0 12 13M88 28 a14 14 0 0 0 12 13M128 28 a14 14 0 0 0 12 13M168 28 a14 14 0 0 0 12 13M208 28 a14 14 0 0 0 12 13M248 28 a14 14 0 0 0 12 13M288 28 a14 14 0 0 0 12 13M328 28 a14 14 0 0 0 12 13M368 28 a14 14 0 0 0 12 13M408 28 a14 14 0 0 0 12 13M448 28 a14 14 0 0 0 12 13M488 28 a14 14 0 0 0 12 13M528 28 a14 14 0 0 0 12 13M568 28 a14 14 0 0 0 12 13M608 28 a14 14 0 0 0 12 13M648 28 a14 14 0 0 0 12 13M688 28 a14 14 0 0 0 12 13M728 28 a14 14 0 0 0 12 13M768 28 a14 14 0 0 0 12 13M808 28 a14 14 0 0 0 12 13M848 28 a14 14 0 0 0 12 13M888 28 a14 14 0 0 0 12 13M928 28 a14 14 0 0 0 12 13" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 0 V22M80 0 V22M120 0 V22M160 0 V22M200 0 V22M240 0 V22M280 0 V22M320 0 V22M360 0 V22M400 0 V22M440 0 V22M480 0 V22M520 0 V22M560 0 V22M600 0 V22M640 0 V22M680 0 V22M720 0 V22M760 0 V22M800 0 V22M840 0 V22M880 0 V22M920 0 V22" stroke="#374151" stroke-width="2" opacity="0.5"/>
  <rect x="0" y="38" width="960" height="18" rx="4" fill="#FFFFFF"/>
  <rect x="0" y="50" width="960" height="6" fill="#E5E7EB"/>

  <g>
    <rect x="76" y="176" width="210" height="230" rx="8" fill="#1F2937" opacity="0.07"/>
    <rect x="70" y="168" width="210" height="230" rx="8" fill="#FFFFFF"/>
    <rect x="84" y="182" width="182" height="202" rx="4" fill="#BFDBFE"/>
    <path d="M100 358 L150 198 M126 364 L166 232" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <rect x="170" y="182" width="10" height="202" fill="#FFFFFF"/>
    <rect x="84" y="278" width="182" height="10" fill="#FFFFFF"/>
    <rect x="58" y="398" width="234" height="14" rx="4" fill="#E5E7EB"/>
    <rect x="58" y="398" width="234" height="5" rx="2.5" fill="#FFFFFF"/>
  </g>
  <g>
    <rect x="696" y="176" width="210" height="230" rx="8" fill="#1F2937" opacity="0.07"/>
    <rect x="690" y="168" width="210" height="230" rx="8" fill="#FFFFFF"/>
    <rect x="704" y="182" width="182" height="202" rx="4" fill="#BFDBFE"/>
    <path d="M720 358 L770 198 M746 364 L786 232" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <rect x="790" y="182" width="10" height="202" fill="#FFFFFF"/>
    <rect x="704" y="278" width="182" height="10" fill="#FFFFFF"/>
    <rect x="678" y="398" width="234" height="14" rx="4" fill="#E5E7EB"/>
    <rect x="678" y="398" width="234" height="5" rx="2.5" fill="#FFFFFF"/>
  </g>

  <!-- front door: frame, the hallway inside and the open door -->
  <rect x="356" y="104" width="268" height="456" rx="6" fill="#1F2937" opacity="0.07" transform="translate(8 0)"/>
  <rect x="348" y="100" width="264" height="460" rx="6" fill="#FFFFFF"/>
  <rect x="592" y="100" width="20" height="460" fill="#E5E7EB"/>
  <!-- hallway: back wall and wooden floor -->
  <rect x="368" y="120" width="224" height="440" fill="#F3F4F6"/>
  <rect x="368" y="120" width="224" height="40" fill="#1F2937" opacity="0.05"/>
  <path d="M368 488 H592 L592 560 H368 Z" fill="#FED7AA"/>
  <path d="M418 488 L392 560 M466 488 L456 560 M514 488 L520 560 M560 488 L584 560" stroke="#FDBA74" stroke-width="3"/>
  <rect x="368" y="480" width="224" height="8" fill="#E5E7EB"/>
  <!-- shelf with bottles above the machine -->
  <rect x="452" y="256" width="124" height="8" rx="3" fill="#D1D5DB"/>
  <rect x="466" y="222" width="22" height="34" rx="6" fill="#60A5FA"/>
  <rect x="470" y="214" width="12" height="10" rx="3" fill="#F97316"/>
  <rect x="496" y="230" width="20" height="26" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="526" y="226" width="26" height="30" rx="7" fill="#FDBA74"/>
  <ellipse cx="518" cy="500" rx="70" ry="6" fill="#1F2937" opacity="0.14" filter="url(#soft-sm)"/>
  <!-- washing machine in the hallway / laundry -->
  <g transform="translate(459 336) scale(0.38)">
    <g id="washer">
      <defs>
        <linearGradient id="washer-body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#F3F4F6"/>
        </linearGradient>
        <linearGradient id="washer-chrome" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
          <stop offset="0" stop-color="#F9FAFB"/>
          <stop offset="0.55" stop-color="#D1D5DB"/>
          <stop offset="1" stop-color="#9CA3AF"/>
        </linearGradient>
        <radialGradient id="washer-glass" cx="0.42" cy="0.38" r="0.7">
          <stop offset="0" stop-color="#DBEAFE"/>
          <stop offset="1" stop-color="#93C5FD"/>
        </radialGradient>
        <radialGradient id="washer-drum" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#6B7280"/>
          <stop offset="0.45" stop-color="#9CA3AF"/>
          <stop offset="1" stop-color="#D1D5DB"/>
        </radialGradient>
        <radialGradient id="washer-seal" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.7" stop-color="#6B7280"/>
          <stop offset="0.86" stop-color="#9CA3AF"/>
          <stop offset="1" stop-color="#6B7280"/>
        </radialGradient>
        <clipPath id="washer-window">
          <circle cx="150" cy="234" r="66"/>
        </clipPath>
      </defs>
      <!-- feet -->
      <rect x="22" y="416" width="34" height="18" rx="5" fill="#374151"/>
      <rect x="244" y="416" width="34" height="18" rx="5" fill="#374151"/>
      <!-- top of the cabinet, seen from slightly above -->
      <path d="M2 8 L298 8 L289 -27 Q288 -32 282 -32 L18 -32 Q12 -32 11 -27 Z" fill="#E5E7EB"/>
      <path d="M8 -6 L292 -6" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
      <!-- front panel -->
      <rect x="0" y="0" width="300" height="425" rx="12" fill="url(#washer-body)"/>
      <!-- control panel strip -->
      <path d="M12 0 H288 A12 12 0 0 1 300 12 V78 H0 V12 A12 12 0 0 1 12 0 Z" fill="#F3F4F6"/>
      <rect x="0" y="78" width="300" height="3" fill="#E5E7EB"/>
      <!-- detergent drawer -->
      <rect x="16" y="17" width="94" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="28" y="48" width="70" height="6" rx="3" fill="#D1D5DB"/>
      <!-- power button -->
      <circle cx="128" cy="39" r="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="128" cy="39" r="3" fill="#F97316"/>
      <!-- display -->
      <rect x="146" y="25" width="66" height="28" rx="6" fill="#1F2937"/>
      <path d="M163 31 C167 36 169 39 169 42 A6 6 0 0 1 157 42 C157 39 159 36 163 31 Z" fill="#93C5FD"/>
      <rect x="176" y="37" width="9" height="5" rx="2.5" fill="#F97316"/>
      <rect x="188" y="37" width="9" height="5" rx="2.5" fill="#F97316"/>
      <rect x="200" y="37" width="6" height="5" rx="2.5" fill="#6B7280"/>
      <!-- programme dial -->
      <circle cx="229.02" cy="58.28" r="2" fill="#9CA3AF"/>
      <circle cx="222.26" cy="42.92" r="2" fill="#9CA3AF"/>
      <circle cx="224.81" cy="26.32" r="2" fill="#9CA3AF"/>
      <circle cx="235.88" cy="13.7" r="2" fill="#9CA3AF"/>
      <circle cx="252" cy="9" r="2" fill="#9CA3AF"/>
      <circle cx="268.12" cy="13.7" r="2" fill="#9CA3AF"/>
      <circle cx="279.19" cy="26.32" r="2" fill="#9CA3AF"/>
      <circle cx="281.74" cy="42.92" r="2" fill="#9CA3AF"/>
      <circle cx="274.98" cy="58.28" r="2" fill="#9CA3AF"/>
      <circle cx="252" cy="39" r="23" fill="#E5E7EB"/>
      <circle cx="252" cy="39" r="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="250" y="24" width="4" height="13" rx="2" fill="#F97316" transform="rotate(-40 252 39)"/>
      <!-- kick plate with the pump filter flap -->
      <rect x="0" y="384" width="300" height="3" fill="#E5E7EB"/>
      <rect x="18" y="396" width="60" height="22" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="38" y="401" width="20" height="4" rx="2" fill="#D1D5DB"/>
      <!-- shaded right-hand edge -->
      <path d="M284 0 H288 A12 12 0 0 1 300 12 V413 A12 12 0 0 1 288 425 H284 Z" fill="#1F2937" opacity="0.06"/>
      <!-- door (closed) -->
      <circle cx="154" cy="239" r="95" fill="#1F2937" opacity="0.08"/>
      <circle cx="150" cy="234" r="93" fill="url(#washer-chrome)" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="150" cy="234" r="79" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
      <circle cx="150" cy="234" r="77" fill="#374151"/>
      <circle cx="150" cy="234" r="66" fill="url(#washer-glass)"/>
      <g clip-path="url(#washer-window)">
        <!-- laundry tumbling in the drum: a white T-shirt and an orange sock -->
        <g transform="translate(130 228) rotate(-16)">
          <path d="M-17 -30 L-36 -22 L-48 -4 L-32 4 L-29 34 L29 34 L32 4 L48 -4 L36 -22 L17 -30 Q0 -17 -17 -30 Z" fill="#FFFFFF"/>
          <path d="M-30 6 L30 6 L30 14 L-30 14 Z" fill="#93C5FD"/>
          <path d="M-29 34 L-27 18 L-12 34 Z" fill="#E5E7EB"/>
          <path d="M-17 -30 Q0 -17 17 -30" fill="none" stroke="#D1D5DB" stroke-width="3"/>
        </g>
        <g transform="translate(194 222) rotate(14) scale(-0.9 0.9)">
          <path d="M-9 -26 L9 -26 L9 6 Q9 12 15 13 L26 15 Q34 17 32 25 Q30 31 22 30 L-2 27 Q-9 26 -9 18 Z" fill="#F97316"/>
          <rect x="-10" y="-26" width="20" height="8" rx="3" fill="#FDBA74"/>
          <path d="M18 14 Q30 15 31 24 Q30 30 22 30 Q24 22 18 14 Z" fill="#C2410C"/>
        </g>
        <!-- water with foam on top -->
        <path d="M76 256 C100 246 122 264 150 256 C178 248 200 264 226 254 L226 310 L76 310 Z" fill="#60A5FA" opacity="0.8"/>
        <g fill="#FFFFFF">
          <circle cx="86" cy="255" r="7"/><circle cx="99" cy="251" r="8"/><circle cx="113" cy="254" r="6"/>
          <circle cx="126" cy="258" r="7"/><circle cx="141" cy="256" r="6"/><circle cx="168" cy="252" r="7"/>
          <circle cx="182" cy="254" r="5.5"/><circle cx="208" cy="256" r="7"/><circle cx="220" cy="252" r="6"/>
        </g>
        <circle cx="104" cy="234" r="3.5" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="178" cy="234" r="2.5" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="214" cy="236" r="3" fill="#FFFFFF" opacity="0.9"/>
      </g>
      <circle cx="150" cy="234" r="66" fill="none" stroke="#1F2937" stroke-width="3" opacity="0.12"/>
      <!-- reflection on the glass -->
      <path d="M97.69 217 A55 55 0 0 1 127.63 183.75" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <path d="M136.69 180.63 A55 55 0 0 1 146.16 179.13" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <!-- door handle (grip moulded into the right of the door ring) -->
      <path d="M232.24 208.86 A86 86 0 0 1 232.24 259.14" fill="none" stroke="#6B7280" stroke-width="9" stroke-linecap="round"/>
      <path d="M233.07 211.74 A86 86 0 0 1 233.07 256.26" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <!-- the door, opened inwards on its left-hand hinges -->
  <path d="M368 120 L414 142 L414 540 L368 560 Z" fill="#F97316"/>
  <path d="M368 120 L382 127 L382 547 L368 560 Z" fill="#C2410C" opacity="0.5"/>
  <path d="M414 142 L420 144 L420 538 L414 540 Z" fill="#9A3412"/>
  <rect x="404" y="330" width="7" height="30" rx="3" fill="#9CA3AF"/>
  <path d="M376 160 L404 172 L404 300 L376 292 Z M376 340 L404 346 L404 510 L376 520 Z" fill="#1F2937" opacity="0.08"/>

  <!-- wall light beside the door -->
  <rect x="650" y="232" width="8" height="26" rx="3" fill="#374151"/>
  <rect x="638" y="214" width="32" height="46" rx="8" fill="#374151"/>
  <rect x="644" y="222" width="20" height="30" rx="5" fill="#FED7AA"/>
  <rect x="636" y="208" width="36" height="10" rx="5" fill="#1F2937"/>

  <!-- porch and front step -->
  <rect x="0" y="560" width="960" height="80" fill="#E5E7EB"/>
  <rect x="0" y="560" width="960" height="6" fill="#D1D5DB"/>
  <rect x="318" y="560" width="324" height="34" rx="6" fill="#F3F4F6"/>
  <rect x="318" y="588" width="324" height="8" rx="4" fill="#D1D5DB"/>
  <!-- doormat -->
  <path d="M396 568 H564 L572 586 H388 Z" fill="#C2410C"/>
  <path d="M404 574 H556 M398 580 H562" stroke="#F97316" stroke-width="2.5"/>

  <ellipse cx="282" cy="626" rx="64" ry="8" fill="#1F2937" opacity="0.14" filter="url(#soft)"/>
  <ellipse cx="726" cy="628" rx="96" ry="9" fill="#1F2937" opacity="0.14" filter="url(#soft)"/>
  <!-- potted plant by the door -->
  <g transform="translate(278 626) scale(0.62)">
    <g id="plant">
      <path d="M-31 -96 C-63.400000000000006 -143 -68.5 -210 -62 -250 C-55.5 -210 -16.599999999999998 -143 -5 -96 Z" fill="#16A34A"/>
      <path d="M-18 -106 C-40 -153 -62 -200 -62 -228" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <path d="M3 -96 C13.599999999999998 -133 51.5 -190 58 -230 C64.5 -190 60.400000000000006 -133 29 -96 Z" fill="#16A34A"/>
      <path d="M16 -106 C37 -143 58 -180 58 -208" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <path d="M-21 -96 C-42 -168 -31.5 -260 -24 -300 C-16.5 -260 12 -168 9 -96 Z" fill="#22C55E"/>
      <path d="M-6 -106 C-15 -178 -24 -250 -24 -278" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <path d="M-6 -96 C-8.2 -158 19 -240 26 -280 C33 -240 42.2 -158 22 -96 Z" fill="#22C55E"/>
      <path d="M8 -106 C17 -168 26 -230 26 -258" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <path d="M-17 -96 C-27 -183 -5.5 -290 2 -330 C9.5 -290 27 -183 13 -96 Z" fill="#86EFAC"/>
      <path d="M-2 -106 C0 -193 2 -280 2 -308" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
      <!-- pot -->
      <path d="M-50 -104 L50 -104 L40 0 L-40 0 Z" fill="#FFFFFF"/>
      <path d="M20 -104 L50 -104 L40 0 L14 0 Z" fill="#9CA3AF" opacity="0.35"/>
      <rect x="-56" y="-112" width="112" height="20" rx="6" fill="#FFFFFF"/>
      <rect x="-56" y="-112" width="112" height="6" rx="3" fill="#FFFFFF" opacity="0.15"/>
    </g>
  </g>
  <!-- technician's toolbox at the front door -->
  <g transform="translate(650 628) scale(0.64)">
    <g id="toolbox">
      <!-- lid, hinged at the back and tipped open (we see its inside face) -->
      <path d="M10 -124 L230 -124 L222 -200 Q221 -206 215 -206 L25 -206 Q19 -206 18 -200 Z" fill="#F97316"/>
      <path d="M26 -132 L214 -132 L208 -190 Q207 -195 202 -195 L38 -195 Q33 -195 32 -190 Z" fill="#C2410C"/>
      <path d="M120 -132 L214 -132 L208 -190 Q207 -195 202 -195 L120 -195 Z" fill="#1F2937" opacity="0.08"/>
      <!-- inside of the box -->
      <path d="M4 -100 L236 -100 L230 -126 L10 -126 Z" fill="#9A3412"/>
      <!-- tools standing in the box -->
      <!-- screwdriver, handle up -->
      <g transform="translate(52 -104) rotate(-12)">
        <rect x="-4" y="-30" width="8" height="34" fill="#9CA3AF"/>
        <rect x="-12" y="-92" width="24" height="64" rx="10" fill="#1F2937"/>
        <rect x="-12" y="-46" width="24" height="10" fill="#F97316"/>
        <rect x="-6" y="-84" width="5" height="34" rx="2.5" fill="#374151"/>
      </g>
      <!-- spanner, ring end up -->
      <g transform="translate(104 -104) rotate(9)">
        <rect x="-7" y="-80" width="14" height="86" rx="6" fill="#9CA3AF"/>
        <rect x="-7" y="-80" width="5" height="86" rx="2.5" fill="#D1D5DB"/>
        <circle cx="0" cy="-92" r="19" fill="#9CA3AF"/>
        <circle cx="0" cy="-92" r="9" fill="#C2410C"/>
        <path d="M-14.01 -95.75 A14.5 14.5 0 0 1 3.75 -106.01" fill="none" stroke="#D1D5DB" stroke-width="4" stroke-linecap="round"/>
      </g>
      <!-- pliers, handles up -->
      <g transform="translate(160 -104)">
        <path d="M-3 4 Q-10 -36 -24 -76" fill="none" stroke="#6B7280" stroke-width="9" stroke-linecap="round"/>
        <path d="M3 4 Q10 -36 22 -78" fill="none" stroke="#6B7280" stroke-width="9" stroke-linecap="round"/>
        <path d="M-15 -44 Q-20 -62 -25 -80" fill="none" stroke="#1F2937" stroke-width="14" stroke-linecap="round"/>
        <path d="M13 -46 Q17 -63 22 -82" fill="none" stroke="#1F2937" stroke-width="14" stroke-linecap="round"/>
        <path d="M-17 -52 Q-20 -64 -23 -74" fill="none" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <!-- tape measure -->
      <g transform="translate(202 -104)">
        <rect x="-17" y="-36" width="34" height="38" rx="9" fill="#E5E7EB"/>
        <circle cx="0" cy="-17" r="9" fill="#9CA3AF"/>
        <circle cx="0" cy="-17" r="3.5" fill="#E5E7EB"/>
      </g>
      <!-- front of the box -->
      <rect x="0" y="-104" width="240" height="104" rx="12" fill="#F97316"/>
      <path d="M12 -104 H228 A12 12 0 0 1 240 -92 V-88 H0 V-92 A12 12 0 0 1 12 -104 Z" fill="#FB923C"/>
      <path d="M0 -16 H240 V-12 A12 12 0 0 1 228 0 H12 A12 12 0 0 1 0 -12 Z" fill="#C2410C"/>
      <path d="M218 -104 H228 A12 12 0 0 1 240 -92 V-12 A12 12 0 0 1 228 0 H218 Z" fill="#1F2937" opacity="0.1"/>
      <!-- latches hanging open -->
      <rect x="38" y="-98" width="26" height="34" rx="5" fill="#D1D5DB"/>
      <rect x="44" y="-74" width="14" height="5" rx="2.5" fill="#6B7280"/>
      <rect x="176" y="-98" width="26" height="34" rx="5" fill="#D1D5DB"/>
      <rect x="182" y="-74" width="14" height="5" rx="2.5" fill="#6B7280"/>
      <rect x="88" y="-60" width="64" height="26" rx="8" fill="#C2410C" opacity="0.5"/>
    </g>
  </g>
</svg>
