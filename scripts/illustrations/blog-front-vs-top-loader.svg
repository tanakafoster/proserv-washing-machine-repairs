<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <title>Front loader next to a top loader</title>
  <desc>Flat illustration: a front loader washing machine and a top loader with its lid open, side by side, with a compare badge between them.</desc>
  <defs>
    <!-- Soft blur for the shadows under objects -->
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft-sm" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <!-- background: one soft shape behind each machine -->
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M536.73 361.82 C515.6 416.74 430.06 477.34 366.67 488.54 C303.29 499.74 195.26 473.5 156.41 429.03 C117.57 384.57 111.17 280.1 133.6 221.77 C156.04 163.44 231.06 89.5 291.03 79.05 C351.01 68.6 452.52 111.94 493.47 159.06 C534.42 206.19 557.87 306.91 536.73 361.82 Z" fill="#FFEDD5"/>
  <path d="M708.99 477.65 C647.16 500.97 536.81 490.74 490.34 449.48 C443.88 408.21 418.69 297.05 430.18 230.06 C441.66 163.07 502.32 69.41 559.25 47.55 C616.18 25.68 721.41 55.19 771.76 98.86 C822.1 142.52 871.79 246.41 861.32 309.54 C850.86 372.67 770.82 454.32 708.99 477.65 Z" fill="#F3F4F6"/>
  <!-- floor -->
  <ellipse cx="480" cy="488" rx="380" ry="26" fill="#FED7AA" opacity="0.45"/>

  <!-- floor shadows -->
  <ellipse cx="331.2" cy="484" rx="120" ry="11" fill="#1F2937" opacity="0.16" filter="url(#soft)"/>
  <ellipse cx="635.2" cy="484" rx="120" ry="11" fill="#1F2937" opacity="0.16" filter="url(#soft)"/>

  <!-- front loader -->
  <g transform="translate(232 214.92) scale(0.62)">
    <g id="frontloader">
      <defs>
        <linearGradient id="frontloader-body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#F3F4F6"/>
        </linearGradient>
        <linearGradient id="frontloader-chrome" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
          <stop offset="0" stop-color="#F9FAFB"/>
          <stop offset="0.55" stop-color="#D1D5DB"/>
          <stop offset="1" stop-color="#9CA3AF"/>
        </linearGradient>
        <radialGradient id="frontloader-glass" cx="0.42" cy="0.38" r="0.7">
          <stop offset="0" stop-color="#DBEAFE"/>
          <stop offset="1" stop-color="#93C5FD"/>
        </radialGradient>
        <radialGradient id="frontloader-drum" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#6B7280"/>
          <stop offset="0.45" stop-color="#9CA3AF"/>
          <stop offset="1" stop-color="#D1D5DB"/>
        </radialGradient>
        <radialGradient id="frontloader-seal" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.7" stop-color="#6B7280"/>
          <stop offset="0.86" stop-color="#9CA3AF"/>
          <stop offset="1" stop-color="#6B7280"/>
        </radialGradient>
        <clipPath id="frontloader-window">
          <circle cx="150" cy="234" r="66"/>
        </clipPath>
      </defs>
      <!-- feet -->
      <rect x="22" y="416" width="34" height="18" rx="5" fill="#374151"/>
      <rect x="244" y="416" width="34" height="18" rx="5" fill="#374151"/>
      <!-- top of the cabinet, seen from slightly above -->
      <path d="M2 8 L298 8 L289 -27 Q288 -32 282 -32 L18 -32 Q12 -32 11 -27 Z" fill="#E5E7EB"/>
      <path d="M8 -6 L292 -6" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
      <!-- front panel -->
      <rect x="0" y="0" width="300" height="425" rx="12" fill="url(#frontloader-body)"/>
      <!-- control panel strip -->
      <path d="M12 0 H288 A12 12 0 0 1 300 12 V78 H0 V12 A12 12 0 0 1 12 0 Z" fill="#F3F4F6"/>
      <rect x="0" y="78" width="300" height="3" fill="#E5E7EB"/>
      <!-- detergent drawer -->
      <rect x="16" y="17" width="94" height="44" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="28" y="48" width="70" height="6" rx="3" fill="#D1D5DB"/>
      <!-- power button -->
      <circle cx="128" cy="39" r="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="128" cy="39" r="3" fill="#F97316"/>
      <!-- display -->
      <rect x="146" y="25" width="66" height="28" rx="6" fill="#1F2937"/>
      <path d="M163 31 C167 36 169 39 169 42 A6 6 0 0 1 157 42 C157 39 159 36 163 31 Z" fill="#93C5FD"/>
      <rect x="176" y="37" width="9" height="5" rx="2.5" fill="#F97316"/>
      <rect x="188" y="37" width="9" height="5" rx="2.5" fill="#F97316"/>
      <rect x="200" y="37" width="6" height="5" rx="2.5" fill="#6B7280"/>
      <!-- programme dial -->
      <circle cx="229.02" cy="58.28" r="2" fill="#9CA3AF"/>
      <circle cx="222.26" cy="42.92" r="2" fill="#9CA3AF"/>
      <circle cx="224.81" cy="26.32" r="2" fill="#9CA3AF"/>
      <circle cx="235.88" cy="13.7" r="2" fill="#9CA3AF"/>
      <circle cx="252" cy="9" r="2" fill="#9CA3AF"/>
      <circle cx="268.12" cy="13.7" r="2" fill="#9CA3AF"/>
      <circle cx="279.19" cy="26.32" r="2" fill="#9CA3AF"/>
      <circle cx="281.74" cy="42.92" r="2" fill="#9CA3AF"/>
      <circle cx="274.98" cy="58.28" r="2" fill="#9CA3AF"/>
      <circle cx="252" cy="39" r="23" fill="#E5E7EB"/>
      <circle cx="252" cy="39" r="18" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="250" y="24" width="4" height="13" rx="2" fill="#F97316" transform="rotate(-40 252 39)"/>
      <!-- kick plate with the pump filter flap -->
      <rect x="0" y="384" width="300" height="3" fill="#E5E7EB"/>
      <rect x="18" y="396" width="60" height="22" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="38" y="401" width="20" height="4" rx="2" fill="#D1D5DB"/>
      <!-- shaded right-hand edge -->
      <path d="M284 0 H288 A12 12 0 0 1 300 12 V413 A12 12 0 0 1 288 425 H284 Z" fill="#1F2937" opacity="0.06"/>
      <!-- door (closed) -->
      <circle cx="154" cy="239" r="95" fill="#1F2937" opacity="0.08"/>
      <circle cx="150" cy="234" r="93" fill="url(#frontloader-chrome)" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="150" cy="234" r="79" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
      <circle cx="150" cy="234" r="77" fill="#374151"/>
      <circle cx="150" cy="234" r="66" fill="url(#frontloader-glass)"/>
      <g clip-path="url(#frontloader-window)">
        <!-- laundry tumbling in the drum: a white T-shirt and an orange sock -->
        <g transform="translate(130 228) rotate(-16)">
          <path d="M-17 -30 L-36 -22 L-48 -4 L-32 4 L-29 34 L29 34 L32 4 L48 -4 L36 -22 L17 -30 Q0 -17 -17 -30 Z" fill="#FFFFFF"/>
          <path d="M-30 6 L30 6 L30 14 L-30 14 Z" fill="#93C5FD"/>
          <path d="M-29 34 L-27 18 L-12 34 Z" fill="#E5E7EB"/>
          <path d="M-17 -30 Q0 -17 17 -30" fill="none" stroke="#D1D5DB" stroke-width="3"/>
        </g>
        <g transform="translate(194 222) rotate(14) scale(-0.9 0.9)">
          <path d="M-9 -26 L9 -26 L9 6 Q9 12 15 13 L26 15 Q34 17 32 25 Q30 31 22 30 L-2 27 Q-9 26 -9 18 Z" fill="#F97316"/>
          <rect x="-10" y="-26" width="20" height="8" rx="3" fill="#FDBA74"/>
          <path d="M18 14 Q30 15 31 24 Q30 30 22 30 Q24 22 18 14 Z" fill="#C2410C"/>
        </g>
        <!-- water with foam on top -->
        <path d="M76 256 C100 246 122 264 150 256 C178 248 200 264 226 254 L226 310 L76 310 Z" fill="#60A5FA" opacity="0.8"/>
        <g fill="#FFFFFF">
          <circle cx="86" cy="255" r="7"/><circle cx="99" cy="251" r="8"/><circle cx="113" cy="254" r="6"/>
          <circle cx="126" cy="258" r="7"/><circle cx="141" cy="256" r="6"/><circle cx="168" cy="252" r="7"/>
          <circle cx="182" cy="254" r="5.5"/><circle cx="208" cy="256" r="7"/><circle cx="220" cy="252" r="6"/>
        </g>
        <circle cx="104" cy="234" r="3.5" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="178" cy="234" r="2.5" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="214" cy="236" r="3" fill="#FFFFFF" opacity="0.9"/>
      </g>
      <circle cx="150" cy="234" r="66" fill="none" stroke="#1F2937" stroke-width="3" opacity="0.12"/>
      <!-- reflection on the glass -->
      <path d="M97.69 217 A55 55 0 0 1 127.63 183.75" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <path d="M136.69 180.63 A55 55 0 0 1 146.16 179.13" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <!-- door handle (grip moulded into the right of the door ring) -->
      <path d="M232.24 208.86 A86 86 0 0 1 232.24 259.14" fill="none" stroke="#6B7280" stroke-width="9" stroke-linecap="round"/>
      <path d="M233.07 211.74 A86 86 0 0 1 233.07 256.26" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- top loader with its lid open -->
  <g transform="translate(536 214.92) scale(0.62)">
    <g id="toploader">
      <defs>
        <linearGradient id="toploader-body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#F3F4F6"/>
        </linearGradient>
        <linearGradient id="toploader-tub" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#D1D5DB"/>
          <stop offset="0.55" stop-color="#6B7280"/>
          <stop offset="1" stop-color="#374151"/>
        </linearGradient>
        <linearGradient id="toploader-lidglass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#BFDBFE"/>
          <stop offset="1" stop-color="#9CA3AF"/>
        </linearGradient>
        <linearGradient id="toploader-agitator" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#D1D5DB"/>
        </linearGradient>
        <clipPath id="toploader-opening">
          <ellipse cx="150" cy="-38" rx="100" ry="23"/>
        </clipPath>
      </defs>
      <!-- control panel at the back -->
      <path d="M19 -146 L281 -146 L277 -156 L23 -156 Z" fill="#E5E7EB"/>
      <path d="M15 -76 V-134 Q15 -146 27 -146 H273 Q285 -146 285 -134 V-76 Z" fill="#F3F4F6"/>
      <rect x="15" y="-80" width="270" height="4" fill="#E5E7EB"/>
      <circle cx="48" cy="-112" r="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="48" cy="-112" r="2.5" fill="#F97316"/>
      <rect x="88" y="-126" width="70" height="28" rx="6" fill="#1F2937"/>
      <path d="M102 -120 C106 -115 108 -112 108 -109 A6 6 0 0 1 96 -109 C96 -112 98 -115 102 -120 Z" fill="#93C5FD"/>
      <rect x="116" y="-114" width="9" height="5" rx="2.5" fill="#F97316"/>
      <rect x="128" y="-114" width="9" height="5" rx="2.5" fill="#F97316"/>
      <rect x="140" y="-114" width="6" height="5" rx="2.5" fill="#6B7280"/>
      <circle cx="178" cy="-112" r="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="200" cy="-112" r="7" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <circle cx="256" cy="-112" r="21" fill="#E5E7EB"/>
      <circle cx="256" cy="-112" r="16" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      <rect x="254" y="-125" width="4" height="12" rx="2" fill="#F97316" transform="rotate(35 256 -112)"/>
      <path d="M273 -146 H273 Q285 -146 285 -134 V-76 H273 Z" fill="#1F2937" opacity="0.06"/>
      <!-- feet -->
      <rect x="22" y="416" width="34" height="18" rx="5" fill="#374151"/>
      <rect x="244" y="416" width="34" height="18" rx="5" fill="#374151"/>
      <!-- top of the cabinet, seen from slightly above -->
      <path d="M2 8 L298 8 L286 -71 Q285 -76 279 -76 L21 -76 Q15 -76 14 -71 Z" fill="#E5E7EB"/>
      <!-- front panel -->
      <rect x="0" y="0" width="300" height="425" rx="12" fill="url(#toploader-body)"/>
      <rect x="0" y="384" width="300" height="3" fill="#E5E7EB"/>
      <rect x="110" y="10" width="80" height="8" rx="4" fill="#E5E7EB"/>
      <path d="M284 0 H288 A12 12 0 0 1 300 12 V413 A12 12 0 0 1 288 425 H284 Z" fill="#1F2937" opacity="0.06"/>
      <!-- the opening in the top, with the drum and the agitator -->
      <ellipse cx="150" cy="-38" rx="108" ry="26" fill="#D1D5DB"/>
      <ellipse cx="150" cy="-38" rx="100" ry="23" fill="url(#toploader-tub)"/>
      <g clip-path="url(#toploader-opening)">
        <path d="M66 -55h0M78 -50h0M90 -55h0M102 -50h0M114 -55h0M126 -50h0M138 -55h0M150 -50h0M162 -55h0M174 -50h0M186 -55h0M198 -50h0M210 -55h0M222 -50h0M234 -55h0" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
        <!-- laundry at the bottom of the drum -->
        <path d="M40 -12 C56 -34 92 -40 116 -28 C126 -22 128 -12 128 -12 Z" fill="#93C5FD"/>
        <path d="M60 -22 C76 -30 94 -30 108 -24" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
        <path d="M172 -12 C172 -26 196 -38 224 -34 C244 -30 258 -18 262 -12 Z" fill="#F97316"/>
        <path d="M196 -24 C210 -30 228 -28 240 -20" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
        <!-- agitator -->
        <rect x="132" y="-52" width="36" height="50" fill="url(#toploader-agitator)"/>
        <path d="M132 -38 L168 -47 M132 -27 L168 -36 M132 -16 L168 -25" stroke="#D1D5DB" stroke-width="3.5"/>
        <ellipse cx="150" cy="-52" rx="18" ry="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
      </g>
      <ellipse cx="150" cy="-38" rx="104" ry="24.5" fill="none" stroke="#E5E7EB" stroke-width="3"/>
      <!-- lid, opened upright against the control panel (white frame, tinted window) -->
      <path d="M64 -74 L72 -226 Q73 -238 85 -238 H215 Q227 -238 228 -226 L236 -74 Z" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
      <path d="M200 -238 H215 Q227 -238 228 -226 L236 -74 H218 Z" fill="#1F2937" opacity="0.05"/>
      <path d="M84 -94 L90 -212 Q90 -218 96 -218 H204 Q210 -218 210 -212 L216 -94 Z" fill="url(#toploader-lidglass)"/>
      <path d="M104 -106 L140 -204 M128 -102 L152 -168" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
      <rect x="124" y="-234" width="52" height="8" rx="4" fill="#D1D5DB"/>
      <rect x="60" y="-84" width="180" height="10" rx="5" fill="#D1D5DB"/>
    </g>
  </g>

  <!-- "compare" badge between them: two arrows -->
  <g transform="translate(486 300)">
    <circle cx="2" cy="4" r="30" fill="#1F2937" opacity="0.12"/>
    <circle cx="0" cy="0" r="30" fill="#F97316"/>
    <path d="M-14 -7 H12 M5 -14 L12 -7 L5 0 M14 7 H-12 M-5 0 L-12 7 L-5 14" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M152 136 Q154.52 147.48 166 150 Q154.52 152.52 152 164 Q149.48 152.52 138 150 Q149.48 147.48 152 136 Z" fill="#F97316"/>
  <path d="M822 140 Q823.8 148.2 832 150 Q823.8 151.8 822 160 Q820.2 151.8 812 150 Q820.2 148.2 822 140 Z" fill="#FDBA74"/>
</svg>
