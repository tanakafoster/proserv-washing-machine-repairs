  <!-- trolley toe plate and wheels -->
  <rect x="418" y="446" width="240" height="12" rx="4" fill="#374151"/>
  <circle cx="422" cy="446" r="24" fill="#1F2937"/><circle cx="422" cy="446" r="9" fill="#9CA3AF"/>
  <circle cx="654" cy="446" r="24" fill="#1F2937"/><circle cx="654" cy="446" r="9" fill="#9CA3AF"/>
  <g transform="translate(730 452) rotate(-6)">
