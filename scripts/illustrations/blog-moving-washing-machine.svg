    <path d="M-28 -9 L-23 -13 L-15 -13 L-10 -9 Z" fill="#9CA3AF"/>
    <rect x="-8" y="-6" width="58" height="12" rx="2" fill="#D1D5DB"/>
    <path d="M10 -6v12M18 -6v12M26 -6v12M34 -6v12M42 -6v12" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="-6" y="-11" width="14" height="22" rx="3" fill="#FDBA74"/>
  </g>
  <g transform="translate(782 462) rotate(4)">
    <path d="M-30 -9 L-24 -15 L-14 -15 L-8 -9 L-8 9 L-14 15 L-24 15 L-30 9 Z" fill="#6B7280"/>
    <path d="M-28 -9 L-23 -13 L-15 -13 L-10 -9 Z" fill="#9CA3AF"/>
    <rect x="-8" y="-6" width="58" height="12" rx="2" fill="#D1D5DB"/>
    <path d="M10 -6v12M18 -6v12M26 -6v12M34 -6v12M42 -6v12" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="-6" y="-11" width="14" height="22" rx="3" fill="#FDBA74"/>
  </g>
  <g transform="translate(836 450) rotate(-12)">
    <path d="M-30 -9 L-24 -15 L-14 -15 L-8 -9 L-8 9 L-14 15 L-24 15 L-30 9 Z" fill="#6B7280"/>
    <path d="M-28 -9 L-23 -13 L-15 -13 L-10 -9 Z" fill="#9CA3AF"/>
    <rect x="-8" y="-6" width="58" height="12" rx="2" fill="#D1D5DB"/>
    <path d="M10 -6v12M18 -6v12M26 -6v12M34 -6v12M42 -6v12" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="-6" y="-11" width="14" height="22" rx="3" fill="#FDBA74"/>
  </g>
  <g transform="translate(790 492) rotate(-4) scale(0.5)">
    <g id="spanner">
      <defs>
        <mask id="spanner-cut" maskUnits="userSpaceOnUse" x="-140" y="-50" width="280" height="100">
