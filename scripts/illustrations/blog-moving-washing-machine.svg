      <path d="M232.24 208.86 A86 86 0 0 1 232.24 259.14" fill="none" stroke="#6B7280" stroke-width="9" stroke-linecap="round"/>
      <path d="M233.07 211.74 A86 86 0 0 1 233.07 256.26" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- straps holding it to the trolley -->
    <rect x="-8" y="128" width="316" height="20" rx="4" fill="#F97316"/>
    <rect x="-8" y="128" width="316" height="7" rx="3" fill="#FDBA74"/>
    <rect x="-8" y="336" width="316" height="20" rx="4" fill="#F97316"/>
    <rect x="-8" y="336" width="316" height="7" rx="3" fill="#FDBA74"/>
    <rect x="132" y="124" width="36" height="28" rx="5" fill="#1F2937"/>
    <rect x="132" y="332" width="36" height="28" rx="5" fill="#1F2937"/>
