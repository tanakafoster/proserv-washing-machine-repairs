  <ellipse cx="537" cy="461" rx="150" ry="12" fill="#1F2937" opacity="0.16" filter="url(#soft)"/>
  <ellipse cx="800" cy="474" rx="90" ry="8" fill="#1F2937" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="222" cy="463" rx="86" ry="8" fill="#1F2937" opacity="0.12" filter="url(#soft)"/>
  <!-- moving box -->
  <rect x="140" y="306" width="166" height="156" fill="#FED7AA"/>
  <path d="M140 306 L118 282 L284 282 L306 306 Z" fill="#FDBA74"/>
  <rect x="210" y="306" width="26" height="156" fill="#FDBA74" opacity="0.8"/>
  <path d="M156 330 h40 M156 344 h28" stroke="#C2410C" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- hand trolley behind the washing machine -->
  <rect x="442" y="44" width="12" height="408" rx="5" fill="#6B7280"/>
  <rect x="620" y="44" width="12" height="408" rx="5" fill="#6B7280"/>
  <rect x="436" y="38" width="202" height="16" rx="8" fill="#374151"/>
  <rect x="500" y="34" width="74" height="22" rx="9" fill="#F97316"/>
  <g transform="translate(420 108) scale(0.78)">
    <g id="washer">
      <defs>
        <linearGradient id="washer-body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#F3F4F6"/>
        </linearGradient>
        <linearGradient id="washer-chrome" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
          <stop offset="0" stop-color="#F9FAFB"/>
          <stop offset="0.55" stop-color="#D1D5DB"/>
          <stop offset="1" stop-color="#9CA3AF"/>
        </linearGradient>
        <radialGradient id="washer-glass" cx="0.42" cy="0.38" r="0.7">
          <stop offset="0" stop-color="#DBEAFE"/>
          <stop offset="1" stop-color="#93C5FD"/>
        </radialGradient>
        <radialGradient id="washer-drum" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#6B7280"/>
          <stop offset="0.45" stop-color="#9CA3AF"/>
          <stop offset="1" stop-color="#D1D5DB"/>
        </radialGradient>
        <radialGradient id="washer-seal" cx="0.5" cy="0.5" r="0.5">
