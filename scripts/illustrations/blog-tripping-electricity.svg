<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <title>Washing machine tripping the electricity</title>
  <desc>Flat illustration: a household DB board on the wall with its earth leakage switch tripped down and highlighted in orange, and a washing machine beside it, unplugged, with a warning sign above it.</desc>
  <defs>
    <!-- Soft blur for the shadows under objects -->
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft-sm" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <!-- background -->
  <rect width="960" height="540" fill="#FFF7ED"/>
  <path d="M828.41 327.46 C808.22 375.66 731.34 425.41 661.5 452.64 C591.66 479.88 482.9 503.73 409.36 490.87 C335.82 478 261 422.03 220.27 375.45 C179.55 328.87 145.03 259.09 165.02 211.39 C185 163.7 269.26 116.32 340.2 89.28 C411.14 62.23 516.89 36.77 590.64 49.13 C664.38 61.49 743.04 117.05 782.67 163.44 C822.3 209.83 848.61 279.26 828.41 327.46 Z" fill="#FFEDD5"/>
  <path d="M104 96h0M126 96h0M148 96h0M170 96h0M104 118h0M126 118h0M148 118h0M170 118h0M104 140h0M126 140h0M148 140h0M170 140h0" stroke="#FDBA74" stroke-width="7" stroke-linecap="round"/>
  <!-- floor -->
  <ellipse cx="490" cy="463.88" rx="400" ry="28" fill="#FED7AA" opacity="0.45"/>
  <ellipse cx="665.2" cy="459.88" rx="150" ry="12" fill="#1F2937" opacity="0.16" filter="url(#soft)"/>
  <ellipse cx="500" cy="466" rx="40" ry="6" fill="#1F2937" opacity="0.12" filter="url(#soft)"/>
  <!-- DB board on the wall -->
  <rect x="146" y="118" width="268" height="232" rx="16" fill="#1F2937" opacity="0.08" transform="translate(4 6)"/>
  <rect x="146" y="118" width="268" height="232" rx="16" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="3"/>
  <rect x="164" y="136" width="232" height="196" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="164" y="214" width="232" height="6" fill="#E5E7EB"/>
  <rect x="176" y="176" width="50" height="84" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="193.0" y="196" width="16" height="44" rx="4" fill="#E5E7EB"/>
  <rect x="194.0" y="194" width="14" height="22" rx="4" fill="#1F2937"/>
  <rect x="180" y="248" width="42" height="5" rx="2.5" fill="#E5E7EB"/>
  <rect x="232" y="176" width="50" height="84" rx="5" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <rect x="249.0" y="196" width="16" height="44" rx="4" fill="#E5E7EB"/>
  <rect x="250.0" y="220" width="14" height="22" rx="4" fill="#F97316"/>
  <circle cx="272" cy="186" r="5" fill="#FDBA74" stroke="#C2410C" stroke-width="1.5"/>
  <rect x="236" y="248" width="42" height="5" rx="2.5" fill="#E5E7EB"/>
  <rect x="288" y="176" width="24" height="84" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="292.0" y="196" width="16" height="44" rx="4" fill="#E5E7EB"/>
  <rect x="293.0" y="194" width="14" height="22" rx="4" fill="#1F2937"/>
  <rect x="292" y="248" width="16" height="5" rx="2.5" fill="#E5E7EB"/>
  <rect x="318" y="176" width="24" height="84" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="322.0" y="196" width="16" height="44" rx="4" fill="#E5E7EB"/>
  <rect x="323.0" y="194" width="14" height="22" rx="4" fill="#1F2937"/>
  <rect x="322" y="248" width="16" height="5" rx="2.5" fill="#E5E7EB"/>
  <rect x="348" y="176" width="24" height="84" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="352.0" y="196" width="16" height="44" rx="4" fill="#E5E7EB"/>
  <rect x="353.0" y="194" width="14" height="22" rx="4" fill="#1F2937"/>
  <rect x="352" y="248" width="16" height="5" rx="2.5" fill="#E5E7EB"/>
  <rect x="378" y="176" width="24" height="84" rx="5" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <rect x="382.0" y="196" width="16" height="44" rx="4" fill="#E5E7EB"/>
  <rect x="383.0" y="194" width="14" height="22" rx="4" fill="#1F2937"/>
  <rect x="382" y="248" width="16" height="5" rx="2.5" fill="#E5E7EB"/>
  <!-- burst lines around the tripped earth leakage switch -->
  <path d="M217.0 288 l-12 10 M257.0 294 v16 M297.0 288 l12 10" stroke="#F97316" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(560 104) scale(0.82)">
    <g id="washer">
      <defs>
        <linearGradient id="washer-body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#F3F4F6"/>
        </linearGradient>
        <linearGradient id="washer-chrome" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
          <stop offset="0" stop-color="#F9FAFB"/>
          <stop offset="0.55" stop-color="#D1D5DB"/>
          <stop offset="1" stop-color="#9CA3AF"/>
        </linearGradient>
        <radialGradient id="washer-glass" cx="0.42" cy="0.38" r="0.7">
          <stop offset="0" stop-color="#DBEAFE"/>
          <stop offset="1" stop-color="#93C5FD"/>
        </radialGradient>
        <radialGradient id="washer-drum" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#6B7280"/>
          <stop offset="0.45" stop-color="#9CA3AF"/>
          <stop offset="1" stop-color="#D1D5DB"/>
        </radialGradient>
        <radialGradient id="washer-seal" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0.7" stop-color="#6B7280"/>
          <stop offset="0.86" stop-color="#9CA3AF"/>
          <stop offset="1" stop-color="#6B7280"/>
        </radialGradient>
        <clipPath id="washer-window">
          <circle cx="150" cy="234" r="66"/>
        </clipPath>
