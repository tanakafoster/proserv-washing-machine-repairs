      <circle cx="0" cy="0" r="21" fill="#F3F4F6"/>
      <path d="M-36.65 -13.34 A39 39 0 0 1 -13.34 -36.65" fill="none" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

