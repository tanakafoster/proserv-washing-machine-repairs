          <path d="M6 46 C10 76 40 78 44 104" fill="none" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
          <path d="M34 100 H54 L56 122 Q56 126 52 126 H36 Q32 126 32 122 Z" fill="#D1D5DB"/>
          <circle cx="44" cy="115" r="4" fill="#6B7280"/>
          <!-- holder with mounting ears -->
          <path d="M-34 -6 H-20 V-18 Q-20 -24 -14 -24 H14 Q20 -24 20 -18 V-6 H34 Q40 -6 40 0 V8 Q40 14 34 14 H20 V42 Q20 48 14 48 H-14 Q-20 48 -20 42 V14 H-34 Q-40 14 -40 8 V0 Q-40 -6 -34 -6 Z" fill="#1F2937" opacity="0.14" transform="translate(4 6)"/>
          <path d="M-34 -6 H-20 V-18 Q-20 -24 -14 -24 H14 Q20 -24 20 -18 V-6 H34 Q40 -6 40 0 V8 Q40 14 34 14 H20 V42 Q20 48 14 48 H-14 Q-20 48 -20 42 V14 H-34 Q-40 14 -40 8 V0 Q-40 -6 -34 -6 Z" fill="#E5E7EB"/>
          <circle cx="-31" cy="4" r="4" fill="#9CA3AF"/>
          <circle cx="31" cy="4" r="4" fill="#9CA3AF"/>
          <rect x="-20" y="-24" width="40" height="9" rx="4" fill="#FFFFFF"/>
          <!-- carbon block -->
          <rect x="-13" y="-74" width="26" height="54" rx="3" fill="#1F2937" opacity="0.14" transform="translate(4 6)"/>
          <rect x="-13" y="-74" width="26" height="54" rx="3" fill="#374151"/>
          <rect x="-13" y="-74" width="8" height="54" rx="3" fill="#6B7280"/>
          <path d="M-13 -66 Q0 -72 13 -66" fill="none" stroke="#1F2937" stroke-width="2" opacity="0.5"/>
        </g>
      </g>
      <g transform="translate(58 4) rotate(4)">
        <g>
          <!-- braided copper lead and its terminal -->
          <path d="M6 46 C10 76 40 78 44 104" fill="none" stroke="#C2410C" stroke-width="7" stroke-linecap="round"/>
          <path d="M6 46 C10 76 40 78 44 104" fill="none" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
          <path d="M34 100 H54 L56 122 Q56 126 52 126 H36 Q32 126 32 122 Z" fill="#D1D5DB"/>
          <circle cx="44" cy="115" r="4" fill="#6B7280"/>
          <!-- holder with mounting ears -->
          <path d="M-34 -6 H-20 V-18 Q-20 -24 -14 -24 H14 Q20 -24 20 -18 V-6 H34 Q40 -6 40 0 V8 Q40 14 34 14 H20 V42 Q20 48 14 48 H-14 Q-20 48 -20 42 V14 H-34 Q-40 14 -40 8 V0 Q-40 -6 -34 -6 Z" fill="#1F2937" opacity="0.14" transform="translate(4 6)"/>
          <path d="M-34 -6 H-20 V-18 Q-20 -24 -14 -24 H14 Q20 -24 20 -18 V-6 H34 Q40 -6 40 0 V8 Q40 14 34 14 H20 V42 Q20 48 14 48 H-14 Q-20 48 -20 42 V14 H-34 Q-40 14 -40 8 V0 Q-40 -6 -34 -6 Z" fill="#E5E7EB"/>
          <circle cx="-31" cy="4" r="4" fill="#9CA3AF"/>
          <circle cx="31" cy="4" r="4" fill="#9CA3AF"/>
          <rect x="-20" y="-24" width="40" height="9" rx="4" fill="#FFFFFF"/>
          <!-- carbon block -->
          <rect x="-13" y="-74" width="26" height="54" rx="3" fill="#1F2937" opacity="0.14" transform="translate(4 6)"/>
          <rect x="-13" y="-74" width="26" height="54" rx="3" fill="#374151"/>
          <rect x="-13" y="-74" width="8" height="54" rx="3" fill="#6B7280"/>
          <path d="M-13 -66 Q0 -72 13 -66" fill="none" stroke="#1F2937" stroke-width="2" opacity="0.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- screws -->
  <g transform="translate(706 494) rotate(15)">
    <circle cx="1" cy="3" r="12" fill="#6B7280"/>
    <circle cx="0" cy="0" r="12" fill="#D1D5DB"/>
    <rect x="-7.800000000000001" y="-1.6" width="15.600000000000001" height="3.2" rx="1.6" fill="#6B7280"/>
    <rect x="-1.6" y="-7.800000000000001" width="3.2" height="15.600000000000001" rx="1.6" fill="#6B7280"/>
  </g>
  <g transform="translate(748 494) rotate(60)">
    <circle cx="1" cy="3" r="12" fill="#6B7280"/>
